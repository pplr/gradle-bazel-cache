[versions]
# Kotlin compiler used to build this project.
kotlin = "2.4.20"
# Language/API level we are allowed to emit against. This MUST NOT exceed the
# Kotlin stdlib embedded in the OLDEST Gradle we support, because Gradle supplies
# the stdlib to plugin classloaders and we deliberately do not bundle it.
#   Gradle 8.0 -> Kotlin 1.8.10   Gradle 8.5 -> 1.9.20   Gradle 9.x -> 2.x
kotlinApi = "2.0"

protobuf = "4.36.2"
protobufPlugin = "0.10.0"
grpc = "1.84.2"

shadow = "9.6.1"
pluginPublish = "2.2.1"

junit = "6.1.3"
assertj = "3.27.7"

[libraries]
protobuf-java = { module = "com.google.protobuf:protobuf-java", version.ref = "protobuf" }
protobuf-protoc = { module = "com.google.protobuf:protoc", version.ref = "protobuf" }
grpc-okhttp = { module = "io.grpc:grpc-okhttp", version.ref = "grpc" }
grpc-stub = { module = "io.grpc:grpc-stub", version.ref = "grpc" }

junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-jupiter-params = { module = "org.junit.jupiter:junit-jupiter-params", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
protobuf = { id = "com.google.protobuf", version.ref = "protobufPlugin" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
plugin-publish = { id = "com.gradle.plugin-publish", version.ref = "pluginPublish" }
