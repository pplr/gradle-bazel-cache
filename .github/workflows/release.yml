name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, without the leading v (e.g. 1.0.0)'
        required: true
      dry_run:
        description: 'Rehearse only: run every check and validate the publish, but do not publish'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    name: Publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    # Gate the secrets behind a GitHub environment so a release needs explicit
    # approval rather than happening on any tag push.
    environment: release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6

      # A published Plugin Portal version cannot be withdrawn, so the release
      # path is rehearsable. A tag push always publishes; a manual dispatch
      # defaults to a rehearsal and has to opt in to publishing.
      - name: Publish or rehearse
        id: mode
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::DRY RUN - everything will be verified and the publish validated, but nothing published."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Publishing for real."
          fi

      # Presence check only, in one step, so the signing key is not exported
      # into the environment of every other step (including third-party
      # actions). Only the boolean escapes.
      - name: Decide whether to mirror to Maven Central
        id: mirror
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          if [ -n "$CENTRAL_USERNAME" ] && [ -n "$SIGNING_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Maven Central mirror: enabled"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Maven Central mirror: skipped (secrets not configured)"
          fi

      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          case "$VERSION" in
            *SNAPSHOT*) echo "::error::refusing to release a SNAPSHOT version ($VERSION)"; exit 1 ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # A hyphen is a semver prerelease identifier (1.0.0-beta, 1.0.0-rc.1).
          # Without this the GitHub release shows as "Latest" on the repo front
          # page, which misrepresents a beta as the current stable version.
          case "$VERSION" in
            *-*) echo "prerelease=true"  >> "$GITHUB_OUTPUT"; echo "Releasing $VERSION (prerelease)" ;;
            *)   echo "prerelease=false" >> "$GITHUB_OUTPUT"; echo "Releasing $VERSION" ;;
          esac

      # A release must not be the first time the full suite runs.
      - name: Verify
        run: ./gradlew build -Pversion=${{ steps.version.outputs.version }} --stacktrace

      - name: Start bazel-remote
        run: |
          docker run -d --name bazel-remote -p 9090:8080 -v bazel-remote-data:/data \
            buchgr/bazel-remote-cache:v2.6.2 --dir /data --max_size 1
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:9090/status >/dev/null && break; sleep 2; done

      - name: Protocol tests against a real server
        env:
          BAZEL_REMOTE_HTTP_URL: http://127.0.0.1:9090/
        run: ./gradlew :cache-client:integrationTest -Pversion=${{ steps.version.outputs.version }}

      - name: Cross-version check
        run: ./gradlew :gradle-plugin:crossVersionTest -Pversion=${{ steps.version.outputs.version }}

      # --- Primary distribution -------------------------------------------
      #
      # The Plugin Portal is independent of Sonatype and is what
      # `plugins { id(...) version "..." }` resolves from by default. It is the
      # only publish a release requires.
      # A re-run of a finished release must not publish again. The Portal
      # accepted a second publish of 1.0.0-beta from a re-run; it was harmless
      # only because the build is reproducible. Detect it and skip instead.
      - name: Is this version already on the Plugin Portal?
        id: portal
        run: |
          V="${{ steps.version.outputs.version }}"
          URL="https://plugins.gradle.org/m2/io/github/pplr/bazel-cache/io.github.pplr.bazel-cache.gradle.plugin/$V/io.github.pplr.bazel-cache.gradle.plugin-$V.pom"
          # Exactly 200, redirects not followed: for anything it does not host,
          # the Portal answers 303 See Other pointing at Maven Central, which
          # `curl -f` would count as success.
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -I "$URL")
          if [ "$CODE" = "200" ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$V is already on the Plugin Portal; the publish step will be skipped."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate the Portal publication (rehearsal)
        if: steps.mode.outputs.publish != 'true'
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        run: >
          ./gradlew publishPlugins --validate-only
          -Pversion=${{ steps.version.outputs.version }} --stacktrace

      - name: Publish to the Gradle Plugin Portal
        if: steps.mode.outputs.publish == 'true' && steps.portal.outputs.published != 'true'
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        run: ./gradlew publishPlugins -Pversion=${{ steps.version.outputs.version }} --stacktrace

      # --- Optional mirror --------------------------------------------------
      #
      # Maven Central is a convenience for organisations that proxy Central but
      # not the Plugin Portal. It is skipped entirely unless its secrets are
      # configured, so a release needs neither a Sonatype account nor a signing
      # key in GitHub secrets.
      - name: Build the signed Central bundle
        if: steps.mirror.outputs.enabled == 'true'
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: >
          ./gradlew :gradle-plugin:centralBundle
          -Pversion=${{ steps.version.outputs.version }}
          -Psigning.enabled=true --stacktrace

      - name: Every artifact must be signed
        if: steps.mirror.outputs.enabled == 'true'
        run: |
          # Central rejects an unsigned bundle, but only after upload.
          MISSING=0
          while read -r f; do
            case "$f" in *.asc|*.md5|*.sha1|*.sha256|*.sha512|*maven-metadata.xml) continue ;; esac
            [ -f "$f.asc" ] || { echo "unsigned: $f"; MISSING=1; }
          done < <(find gradle-plugin/build/staging-repo -type f)
          [ "$MISSING" -eq 0 ] || { echo "::error::unsigned artifacts in the bundle"; exit 1; }
          echo "all artifacts signed"

      - name: Upload to the Sonatype Central Portal
        if: steps.mirror.outputs.enabled == 'true' && steps.mode.outputs.publish == 'true'
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
        run: |
          TOKEN=$(printf '%s:%s' "$CENTRAL_USERNAME" "$CENTRAL_PASSWORD" | base64 -w0)
          HTTP=$(curl -sS -o upload.out -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -F "bundle=@gradle-plugin/build/central/central-bundle.zip" \
            "https://central.sonatype.com/api/v1/publisher/upload?name=gradle-bazel-cache-${{ steps.version.outputs.version }}")
          echo "HTTP $HTTP"; cat upload.out; echo
          case "$HTTP" in
            2*) echo "uploaded; the deployment still needs releasing in the Central UI unless auto-publish is on" ;;
            *)  echo "::error::Central upload failed with HTTP $HTTP"; exit 1 ;;
          esac

      - name: Note when the Central mirror was skipped
        if: steps.mirror.outputs.enabled != 'true'
        run: |
          echo "::notice::Maven Central was skipped because CENTRAL_USERNAME and/or SIGNING_KEY are not configured. See docs/RELEASING.md."

      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/') && steps.mode.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR="gradle-plugin/build/libs/gradle-bazel-cache-${{ steps.version.outputs.version }}.jar"
          PRERELEASE="${{ steps.version.outputs.prerelease }}"
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            # A re-run: the release exists. Refresh the asset instead of failing.
            gh release upload "${GITHUB_REF_NAME}" "$JAR" --clobber
            gh release edit "${GITHUB_REF_NAME}" --prerelease="$PRERELEASE"
            echo "::notice::Release ${GITHUB_REF_NAME} already existed; asset refreshed."
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes \
              --prerelease="$PRERELEASE" \
              "$JAR"
          fi
